
<!DOCTYPE html>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/static/send.html">DakGhar</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/static/send.html">Send</a>

<div class="page-container">

    <h1 class="page-title">Providers & Worker</h1>
    <p class="page-description">
        Monitor your mock email and SMS providers.
    </p>

    <div id="message-area"></div>

    <div class="row" id="provider-list">
        <div class="col-12 text-center p-4">Loading providers...</div>
    </div>

    <div class="card mt-4">
        <div class="card-header">Background Worker</div>
        <div class="card-body">
            <div id="worker-status" class="mb-3">Loading worker status...</div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-primary" id="pause-worker">Pause worker</button>
                <button class="btn btn-outline-primary" id="resume-worker">Resume worker</button>
                <button class="btn btn-primary" id="worker-tick">Run one tick</button>
                <button class="btn btn-outline-secondary" id="refresh-worker">Refresh status</button>
            </div>
            <p class="muted mt-3 mb-0">Worker controls require the admin API key.</p>
        </div>
    </div>
</div>

<footer class="page-footer">DakGhar Notification Delivery Service</footer>
