
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Inbox | DakGhar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/static/send.html">DakGhar</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/static/send.html">Send</a>
            <a class="nav-link" href="/static/outbox.html">Outbox</a>
            <a class="nav-link" href="/static/providers.html">Providers</a>
            <a class="nav-link active" href="/static/inbox.html">Inbox</a>
            <a class="nav-link" href="/static/about.html">How it works</a>
        </div>
    </div>
</nav>

<div class="page-container">

    <h1 class="page-title">Fake Inbox</h1>
    <p class="page-description">
        Messages successfully delivered by mock providers appear here.
    </p>

    <div id="message-area"></div>

    <div class="card">
        <div class="card-body">

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Filter by provider</label>

                    <select class="form-select" id="provider-filter">
                        <option value="">All providers</option>
                        <option value="mailfast">Mailfast</option>
                        <option value="postbird">Postbird</option>
                        <option value="smsly">SMSly</option>
                        <option value="textgo">TextGo</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-primary w-100" id="refresh-inbox">
                        Refresh inbox
                    </button>
                </div>
            </div>

            <div id="inbox-list">
                <div class="empty-state">Loading inbox...</div>
            </div>

        </div>
    </div>

</div>

<footer class="page-footer">DakGhar Notification Delivery Service</footer>

<script src="/static/js/api.js"></script>
<script src="/static/js/inbox.js"></script>

</body>
