
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outbox | DakGhar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/static/send.html">DakGhar</a>
        <button class="navbar-toggler bg-light" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/static/send.html">Send</a>
                <a class="nav-link active" href="/static/outbox.html">Outbox</a>
                <a class="nav-link" href="/static/providers.html">Providers</a>
                <a class="nav-link" href="/static/inbox.html">Inbox</a>
                <a class="nav-link" href="/static/about.html">How it works</a>
            </div>
        </div>
    </div>
</nav>

<div class="page-container">

    <h1 class="page-title">Message Outbox</h1>
    <p class="page-description">
        View and track all accepted messages.
    </p>

    <div id="message-area"></div>

    <div class="row">
        <div class="col-md-3">
            <div class="count-card">
                <h6>Pending</h6>
                <h2 id="pending-count">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="count-card">
                <h6>Sending</h6>
                <h2 id="sending-count">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="count-card">
                <h6>Sent</h6>
                <h2 id="sent-count">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="count-card">
                <h6>Failed</h6>
                <h2 id="failed-count">0</h2>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">

            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select id="status-filter" class="form-select">
                        <option value="">All statuses</option>
                        <option value="pending">Pending</option>
                        <option value="sending">Sending</option>
                        <option value="sent">Sent</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Channel</label>
                    <select id="channel-filter" class="form-select">
                        <option value="">All channels</option>
                        <option value="email">Email</option>
                        <option value="sms">SMS</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Category</label>
                    <select id="category-filter" class="form-select">
                        <option value="">All categories</option>
                        <option value="transactional">Transactional</option>
                        <option value="marketing">Marketing</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-outline-primary w-100"
                        id="refresh-button">
                        Refresh
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <span class="muted" id="refresh-status">
                    Auto-refresh every 2 seconds
                </span>
                <button class="btn btn-sm btn-outline-secondary"
                    id="pause-refresh">
                    Pause refresh
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Created</th>
                            <th>Channel</th>
                            <th>Category</th>
                            <th>Recipient</th>
                            <th>Status</th>
                            <th>Attempts</th>
                            <th>Provider</th>
                        </tr>
                    </thead>
                    <tbody id="message-list">
                        <tr><td colspan="8" class="text-center">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <button class="btn btn-outline-primary" id="load-older">
                Load older
            </button>
        </div>
    </div>
</div>

<footer class="page-footer">DakGhar Notification Delivery Service</footer>

<script src="/static/js/api.js"></script>
<script src="/static/js/outbox.js"></script>

</body>
</html>
